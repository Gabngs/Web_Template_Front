<p-dialog
  [visible]="visible()"
  [modal]="true"
  [dismissableMask]="false"
  [closable]="false"
  [closeOnEscape]="false"
  [draggable]="false"
  [style]="{ width: '420px' }"
  header="Cambio de contraseña obligatorio"
>
  <p class="cambiar-password__intro">
    Por seguridad debes establecer una nueva contraseña antes de continuar.
  </p>

  <form class="cambiar-password__form" (ngSubmit)="submit()">
    <p-floatlabel>
      <p-password
        inputId="cp-actual"
        [(ngModel)]="passwordActual"
        name="passwordActual"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
      <label for="cp-actual">Contraseña actual</label>
    </p-floatlabel>

    <p-floatlabel>
      <p-password
        inputId="cp-nueva"
        [(ngModel)]="passwordNueva"
        name="passwordNueva"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
      <label for="cp-nueva">Contraseña nueva</label>
    </p-floatlabel>

    <p-floatlabel>
      <p-password
        inputId="cp-confirmar"
        [(ngModel)]="passwordConfirmar"
        name="passwordConfirmar"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
      <label for="cp-confirmar">Confirmar contraseña nueva</label>
    </p-floatlabel>

    @if (error()) {
      <div class="cambiar-password__error">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ error() }}</span>
      </div>
    }

    <p-button type="submit" label="Cambiar contraseña" icon="pi pi-lock" [loading]="loading()" class="w-full" />
  </form>
</p-dialog>
